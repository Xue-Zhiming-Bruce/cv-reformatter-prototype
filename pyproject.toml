[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-reformatter"
version = "0.1.0"
description = "Local MVP for recruiter-branded candidate profile extraction."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.52.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "openai>=2.44.0",
    "pdfplumber>=0.11.9",
    "Pillow>=12.0.0",
    "pydantic>=2.7.0",
    "pypdf>=6.0.0",
    "pypdfium2>=4.30.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "reportlab>=4.4.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-n", "auto"]
markers = [
    "integration: exercises multiple backend components without external provider calls",
    "local_dataset: uses the ignored local resume corpus and may take longer",
    "live_provider: makes an explicitly enabled external-provider call",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
